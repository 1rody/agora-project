<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../styles/Globals.css">
    <script type="module" src="../scripts/Session.js"></script>
    <script type="module">
        import { getSessionProfileId, showStartupContent } from "../scripts/Session.js";
        import { getProfile } from "../data/AccountMock.js";
        import { NOW } from "../data/AgoraMock.js";
        import { addTask } from "../data/MockTask.js";
        import { parseTaskDate } from "../data/TaskDates.js";
        import { readTaskMessage, TASK_FIELDS } from "../scripts/TaskMessage.js";
        import { fillTaskCard } from "../scripts/UpcomingTasks.js";

        const form = document.querySelector("#chat-form");
        const messages = document.querySelector("#messages");
        const template = document.querySelector("#created-task");
        let draft = {};

        const userName = getProfile(getSessionProfileId())?.name?.trim().split(/\s+/)[0] || "VOCÊ";
        const showMessage = (text, author, success = false) => {
            const row = document.createElement("div"); row.className = "chat-message";
            const label = document.createElement("strong"); label.className = "chat-author";
            label.textContent = author === "user" ? userName.toLocaleUpperCase("pt-BR") : "AGORA IA";
            const message = document.createElement("p"); message.textContent = text;
            if (success) { message.className = "chat-success"; message.setAttribute("role", "status"); }
            row.append(label, message); messages.append(row); messages.scrollTop = messages.scrollHeight;
        };
        showMessage("Deseja adicionar uma tarefa?", "bot");
        showMessage("Informe o prazo, título, tempo estimado e prioridade", "bot");
        const mic = document.querySelector("#chat-mic");
        const voiceStatus = document.querySelector("#voice-status");
        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Recognition) { mic.disabled = true; mic.title = "Seu navegador não suporta voz"; }
        else {
            const recognition = new Recognition(); recognition.lang = "pt-BR";
            recognition.onstart = () => { voiceStatus.textContent = "Ouvindo..."; mic.setAttribute("aria-pressed", "true"); };
            recognition.onend = () => { voiceStatus.textContent = ""; mic.setAttribute("aria-pressed", "false"); };
            recognition.onerror = () => { voiceStatus.textContent = "Não foi possível reconhecer a fala."; };
            recognition.onresult = (event) => { form.elements.message.value = event.results[0][0].transcript; form.elements.message.focus(); };
            mic.addEventListener("click", () => { if (mic.getAttribute("aria-pressed") === "true") recognition.stop(); else recognition.start(); });
        }

        const getMissing = () => Object.keys(TASK_FIELDS).filter((field) => !draft[field]);

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            const text = form.elements.message.value.trim();
            if (!text) return;

            showMessage(text, "user");
            form.reset();

            const incoming = readTaskMessage(text, NOW, getMissing());
            if (draft.name) delete incoming.name;
            draft = { ...draft, ...incoming };
            const missing = getMissing();

            if (missing.length) {
                const fields = new Intl.ListFormat("pt-BR").format(missing.map((field) => TASK_FIELDS[field]));
                showMessage("Informe " + fields + ".", "bot");
                return;
            }

            const task = addTask({
                ...draft,
                profileId: getSessionProfileId(),
                description: "",
                startDate: draft.startDate ?? (parseTaskDate(draft.endDate, true) < NOW ? "" : NOW.toISOString()),
                scheduled: false,
            });
            draft = {};
            showMessage("Evento criado com sucesso", "bot", true);
            const card = template.content.cloneNode(true);
            fillTaskCard(card, task);
            messages.append(card);
            messages.scrollTop = messages.scrollHeight;
        });
        showStartupContent();
    </script>


    <title>Agora</title>
</head>
<body class="google-sans" data-requires-session>
    <p class="p-2" data-startup-message role="status">
        <span>Se a página não carregar, abra o projeto pelo servidor HTTP local e acesse src/login.html.</span> <a class="text-primary" href="../login.html">Ir para o login</a>
    </p>
    <div data-startup-content hidden>
    <main id="new-task" class="w-full flex flex-col">
        <header class="chat-header"><a class="chat-back glass" href="../app.html" aria-label="Voltar para o início">←</a><h1>ADIC. TAREFA</h1></header>
        <section id="messages" class="chat-messages" role="log" aria-label="Conversa com a Agora IA" aria-live="polite"></section>
        <form id="chat-form" class="chat-form"><p id="voice-status" class="voice-status" role="status"></p><div class="chat-controls"><button id="chat-mic" class="chat-icon glass" type="button" aria-label="Usar microfone" aria-pressed="false"><img src="../../assets/icons/Mic.svg" alt=""></button><div class="chat-entry glass"><input class="chat-input" placeholder="Digite sua resposta" type="text" name="message" id="message" autocomplete="off" aria-label="Mensagem para a Agora IA"><button class="chat-icon chat-submit" type="submit" aria-label="Enviar mensagem"><img src="../../assets/icons/Search.svg" alt=""></button></div></div></form>
    </main>
    <template id="created-task"><article class="chat-task glass rounded-md"><div class="chat-task-title"><h2 class="task-title" data-field="name"></h2><span class="text-xs priority" data-field="priority"></span></div><span class="task-time" data-field="estimatedTime"></span><p class="text-xs" data-field="period"></p></article></template>
