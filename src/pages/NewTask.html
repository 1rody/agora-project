<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../styles/Globals.css">
    <script type="module">
        import { addTask } from "../data/MockTask.js";

        const form = document.querySelector("#task-form");

        //ao enviar cria a task no array (perfil 01) e mostra a mensagem
        form.addEventListener("submit", (event) => {
            event.preventDefault();

            const task = addTask({
                profileId: "01",
                name: form.elements.name.value,
                description: form.elements.description.value,
                startDate: form.elements.startDate.value,
                endDate: form.elements.endDate.value,
                priority: form.elements.priority.value,
                estimatedTime: Number(form.elements.estimatedTime.value),
            });

            form.querySelector('[data-field="message"]').textContent = `Tarefa criada: ${task.name}`;
            form.reset();
        });
    </script>


    <title>Agora</title>
</head>
<body class="google-sans">
    <main id="new-task" class="w-full gap-1 overflow-hidden flex flex-col h-screen">
        <form id="task-form" class="p-1 flex text-primary flex-col items-center h-screen justify-center">
            <fieldset class="border-none flex flex-col w-fit">
                <label for="name" class="text-primary text-sm">NOME</label>
                <input class="p-1 rounded-md text-primary bg-background" placeholder="Estudar JS" type="text" name="name" id="name" required>
            </fieldset>
            <fieldset class="border-none flex flex-col w-fit">
                <label for="description" class="text-primary text-sm">DESCRICAO</label>
                <input class="p-1 rounded-md text-primary bg-background" placeholder="Revisar modulos" type="text" name="description" id="description" required>
            </fieldset>
            <fieldset class="border-none flex flex-col w-fit">
                <label for="priority" class="text-primary text-sm">PRIORIDADE</label>
                <select class="p-1 rounded-md text-primary bg-background" name="priority" id="priority" required>
                    <option value="low">Baixa</option>
                    <option value="medium">Media</option>
                    <option value="high">Alta</option>
                </select>
            </fieldset>
            <fieldset class="border-none flex flex-col w-fit">
                <label for="startDate" class="text-primary text-sm">INICIO</label>
                <input class="p-1 rounded-md text-primary bg-background" type="date" name="startDate" id="startDate" required>
            </fieldset>
            <fieldset class="border-none flex flex-col w-fit">
                <label for="endDate" class="text-primary text-sm">FIM</label>
                <input class="p-1 rounded-md text-primary bg-background" type="date" name="endDate" id="endDate" required>
            </fieldset>
            <fieldset class="border-none flex flex-col w-fit">
                <label for="estimatedTime" class="text-primary text-sm">TEMPO ESTIMADO (MIN)</label>
                <input class="p-1 rounded-md text-primary bg-background" placeholder="55" type="number" min="1" name="estimatedTime" id="estimatedTime" required>
            </fieldset>
            <p class="text-sm" data-field="message"></p>
            <button class="primary-btn" type="submit">CRIAR TAREFA</button>
            <a class="text-sm text-primary" href="../app.html">Voltar</a>
        </form>
    </main>
</body>

</html>
