<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../styles/Globals.css">
    <script type="module" src="../scripts/Session.js"></script>
    <script type="module">
        import { showStartupContent } from "../scripts/Session.js";
        import { NOW, PROFILE_ID } from "../data/AgoraMock.js";
        import { addTask } from "../data/MockTask.js";
        import { parseTaskDate } from "../data/TaskDates.js";
        import { readTaskMessage, TASK_FIELDS } from "../scripts/TaskMessage.js";
        import { fillTaskCard } from "../scripts/UpcomingTasks.js";

        const form = document.querySelector("#chat-form");
        const messages = document.querySelector("#messages");
        const template = document.querySelector("#created-task");
        let draft = {};

        const showMessage = (text, author) => {
            const row = document.createElement("div");
            row.className = author === "user" ? "flex w-full justify-end" : "flex w-full justify-start";

            const bubble = document.createElement("p");
            bubble.className = author === "user" ? "chat-bubble chat-user rounded-xl p-1 text-sm" : "chat-bubble glass rounded-xl p-1 text-sm";
            bubble.textContent = text;

            row.append(bubble);
            messages.append(row);
            messages.scrollTop = messages.scrollHeight;
        };

        showMessage("Deseja adicionar uma tarefa?", "bot");
        showMessage("Informe o prazo, título, tempo estimado e prioridade", "bot");

        const getMissing = () => Object.keys(TASK_FIELDS).filter((field) => !draft[field]);

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            const text = form.elements.message.value.trim();
            if (!text) return;

            showMessage(text, "user");
            form.reset();

            const incoming = readTaskMessage(text, NOW, getMissing());
            if (draft.name) delete incoming.name;
            draft = { ...draft, ...incoming };
            const missing = getMissing();

            if (missing.length) {
                const fields = new Intl.ListFormat("pt-BR").format(missing.map((field) => TASK_FIELDS[field]));
                showMessage("Informe " + fields + ".", "bot");
                return;
            }

            const task = addTask({
                ...draft,
                profileId: PROFILE_ID,
                description: "",
                startDate: parseTaskDate(draft.endDate, true) < NOW ? "" : NOW.toISOString(),
                scheduled: false,
            });
            draft = {};
            showMessage("✓ Evento criado com sucesso", "bot");
            const card = template.content.cloneNode(true);
            fillTaskCard(card, task);
            messages.append(card);
            messages.scrollTop = messages.scrollHeight;
        });
        showStartupContent();
    </script>


    <title>Agora</title>
</head>
<body class="google-sans" data-requires-session>
    <p class="p-2" data-startup-message role="status">
        <span>Se a página não carregar, abra o projeto pelo servidor HTTP local e acesse src/login.html.</span> <a class="text-primary" href="../login.html">Ir para o login</a>
    </p>
    <div data-startup-content hidden>
    <main id="new-task" class="w-full gap-1 items-center justify-center overflow-hidden flex flex-col h-screen">
        <header class="flex w-full items-center  justify-center gap-1 p-1 pt-5">
            <a class="glass rounded-xl p-1 text-xl text-primary" href="../app.html">←</a>
            <h1 class="text-xl text-center">Agora IA</h1>
        </header>
        <section id="messages" class="chat-messages overflow-hidden flex flex-col gap-1 p-1 w-full" role="log" aria-label="Conversa com a Agora IA"></section>
        <form id="chat-form" class="flex w-full items-center gap-1 p-1">
            <div class="flex w-full items-center gap-1 glass rounded-xl p-1">
                <input class="chat-input w-full p-1 text-primary border-none" placeholder="Digite sua resposta" type="text" name="message" id="message" autocomplete="off" aria-label="Mensagem para a Agora IA">
                <button class="rounded-xl p-1 border-none" type="button" aria-label="Microfone" aria-disabled="true">🎙</button>
                <button class="chat-send rounded-xl p-1" type="submit">Enviar</button>
            </div>
        </form>
    </main>
    <template id="created-task">
        <article class="glass rounded-md p-2 flex flex-col">
            <h2 class="text-lg" data-field="name"></h2>
            <p data-field="estimatedTime"></p>
            <p class="text-sm" data-field="priority"></p>
            <p class="text-sm" data-field="period"></p>
        </article>
    </template>
    </div>
</body>

</html>
