<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../styles/Globals.css">
    <script type="module">
        import { addTask } from "../data/MockTask.js";
        import { getCurrentProfile } from "../data/AccountMock.js";

        const questions = [
            { field: "name", text: "Qual o nome da tarefa?" },
            { field: "description", text: "Descreva a tarefa." },
            { field: "priority", text: "Qual a prioridade? (baixa, media, alta)" },
            { field: "startDate", text: "Quando começa?" },
            { field: "endDate", text: "Quando termina?" },
            { field: "estimatedTime", text: "Quanto tempo estimado em minutos?" },
        ];

        const form = document.querySelector("#chat-form");
        const messages = document.querySelector("#messages");
        const answers = {};
        let step = 0;

        const showMessage = (text, author) => {
            const row = document.createElement("div");
            row.className = author === "user" ? "flex w-full justify-end" : "flex w-full justify-start";

            const bubble = document.createElement("p");
            bubble.className = author === "user" ? "chat-bubble chat-user rounded-xl p-1 text-sm" : "chat-bubble glass rounded-xl p-1 text-sm";
            bubble.textContent = text;

            row.append(bubble);
            messages.append(row);
            messages.scrollTop = messages.scrollHeight;
        };

        showMessage(questions[0].text, "bot");

        form.addEventListener("submit", (event) => {
            event.preventDefault();

            const text = form.elements.message.value.trim();
            if (!text || step >= questions.length) return;

            showMessage(text, "user");
            answers[questions[step].field] = text;
            form.reset();
            step++;

            setTimeout(() => {
                if (step < questions.length) {
                    showMessage(questions[step].text, "bot");
                    return;
                }

                const task = addTask({ profileId: getCurrentProfile().id, ...answers, estimatedTime: Number(answers.estimatedTime) || 0 });
                showMessage(`Tarefa criada: ${task.name}`, "bot");
            }, 400);
        });
    </script>


    <title>Agora</title>
</head>
<body class="google-sans">
    <main id="new-task" class="w-full gap-1 items-center justify-center overflow-hidden flex flex-col h-screen">
        <header class="flex w-full items-center  justify-center gap-1 p-1 pt-5">
            <a class="glass rounded-xl p-1 text-xl text-primary" href="../app.html">←</a>
            <h1 class="text-xl text-center">ADICIONAR TAREFA</h1>
        </header>
        <section id="messages" class="chat-messages overflow-hidden flex flex-col gap-1 p-1 w-full"></section>
        <form id="chat-form" class="flex w-full items-center gap-1 p-1">
            <div class="flex w-full items-center gap-1 glass rounded-xl p-1">
                <input class="chat-input w-full p-1 text-primary border-none" placeholder="Digite sua resposta" type="text" name="message" id="message" autocomplete="off">
                <button class="chat-send rounded-xl p-1" type="submit">Enviar</button>
            </div>
        </form>
    </main>
</body>

</html>
