<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/Globals.css">
    <link rel="stylesheet" href="../../styles/Settings.css">
    <script type="module" src="../../scripts/Settings.js"></script>
    <title>Agora - Configurações</title>
</head>
<body class="google-sans" data-requires-session>
    <p class="p-2" data-startup-message role="status">
        <span>Se a página não carregar, abra o projeto pelo servidor HTTP local.</span>
        <a href="../../login.html">Ir para o login</a>
    </p>
    <div data-startup-content hidden>
        <main id="settings" class="settings-page">
            <header class="settings-header">
                <a id="settings-back" class="settings-back glass" href="../../app.html" aria-label="Voltar">←</a>
                <h1 id="settings-title">CONFIGURAÇÕES</h1>
            </header>
            <section id="profile" class="settings-section">
                <h2>PERFIL</h2>
                <a class="profile-card glass" href="#perfil" aria-label="Editar perfil">
                    <strong data-field="name"></strong>
                    <span>Membro desde <span data-field="memberSince"></span></span>
                    <span data-field="age"></span>
                    <span>Pronomes <span data-field="pronouns"></span></span>
                    <span class="settings-link">EDITAR PERFIL</span>
                </a>
                <div class="settings-row">
                    <span>VERIFICAÇÃO DE DOIS FATORES</span>
                    <strong class="settings-success">ATIVADA</strong>
                </div>
                <div class="settings-row">
                    <span>E-MAIL DE RECUPERAÇÃO</span>
                    <a class="settings-link" href="./Security.html#recuperacao" data-field="recovery"></a>
                </div>
                <h2><span aria-hidden="true">🔒︎</span> SEGURANÇA</h2>
                <a class="settings-pill glass" href="./Dispositivos.html">GERENCIAR DISPOSITIVOS</a>
                <a class="settings-pill glass" href="./Security.html">SENHA E RECUPERAÇÃO</a>
                <a class="settings-link settings-menu-link" href="./Privacidade.html">PRIVACIDADE E DADOS</a>
                <a class="settings-link settings-menu-link" href="../support/Support.html">SUPORTE</a>
            </section>
            <section id="perfil" class="settings-section" hidden>
                <form id="profile-form" class="form-style settings-form" novalidate>
                    <fieldset class="border-none flex flex-col">
                        <label for="profile-name">NOME</label>
                        <input id="profile-name" name="name" type="text" placeholder=" " autocomplete="name" required>
                    </fieldset>
                    <fieldset class="border-none flex flex-col">
                        <label for="profile-birth-date">DATA DE NASCIMENTO</label>
                        <input id="profile-birth-date" name="birthDate" type="date" placeholder=" " autocomplete="bday">
                    </fieldset>
                    <fieldset class="border-none flex flex-col">
                        <label for="profile-pronouns">PRONOMES</label>
                        <input id="profile-pronouns" name="pronouns" type="text" placeholder=" " >
                    </fieldset>
                    <button class="settings-button" type="submit">SALVAR</button>
                    <p role="status"></p>
                </form>
            </section>
        </main>
        <footer class="settings-footer">
            <nav id="navigation" class="flex items-center w-full justify-between p-1" aria-label="Navegação principal">
                <ol class="flex items-center gap-1 glass rounded-xl p-1 justify-around">
                    <li>
                        <a href="../../app.html">
                            <img src="../../../assets/icons/Brand.svg" alt="Início">
                        </a>
                    </li>
                    <li>
                        <a href="../Tarefas.html">
                            <img src="../../../assets/icons/List.svg" alt="Tarefas">
                        </a>
                    </li>
                    <li>
                        <a href="./Settings.html" aria-current="page">
                            <img src="../../../assets/icons/Settings.svg" alt="Configurações">
                        </a>
                    </li>
                </ol>
                <ol class="glass rounded-xl p-1">
                    <li>
                        <a href="../NewTask.html">
                            <img src="../../../assets/icons/Create.svg" alt="Adicionar tarefa">
                        </a>
                    </li>
                </ol>
            </nav>
        </footer>
    </div>
</body>
</html>
