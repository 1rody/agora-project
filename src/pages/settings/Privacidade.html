<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles/Globals.css">
    <link rel="stylesheet" href="../../styles/Settings.css">
    <script type="module" src="../../scripts/Settings.js"></script>
    <title>Agora - Privacidade e dados</title>
</head>
<body class="google-sans" data-requires-session>
    <p class="p-2" data-startup-message role="status">
        <span>Se a página não carregar, abra o projeto pelo servidor HTTP local.</span>
        <a href="../../login.html">Ir para o login</a>
    </p>
    <div data-startup-content hidden>
        <main id="privacy" class="settings-page">
            <header class="settings-header">
                <a id="settings-back" class="settings-back glass" href="./Settings.html" aria-label="Voltar">←</a>
                <h1 id="settings-title">PRIVACIDADE E DADOS</h1>
            </header>
            <section class="settings-section">
                <p>Baixe uma cópia dos dados desta conta ou apague suas tarefas e seu histórico.</p>
                <button id="export-data" class="settings-pill glass" type="button">EXPORTAR MEUS DADOS</button>
                <button id="delete-data" class="settings-pill glass" type="button">APAGAR TAREFAS E HISTÓRICO</button>
                <div id="delete-confirmation" class="confirmation glass" hidden>
                    <p>Apagar todas as tarefas e o histórico deste perfil?</p>
                    <button id="confirm-delete" class="settings-button" type="button">CONFIRMAR EXCLUSÃO</button>
                    <button id="cancel-delete" class="text-button settings-link" type="button">CANCELAR</button>
                </div>
                <p id="privacy-feedback" role="status"></p>
            </section>
        </main>
        <footer class="settings-footer">
            <nav id="navigation" class="flex items-center w-full justify-between p-1" aria-label="Navegação principal">
                <ol class="flex items-center gap-1 glass rounded-xl p-1 justify-around">
                    <li>
                        <a href="../../app.html">
                            <img src="../../../assets/icons/Brand.svg" alt="Início">
                        </a>
                    </li>
                    <li>
                        <a href="../Tarefas.html">
                            <img src="../../../assets/icons/List.svg" alt="Tarefas">
                        </a>
                    </li>
                    <li>
                        <a href="./Settings.html" aria-current="page">
                            <img src="../../../assets/icons/Settings.svg" alt="Configurações">
                        </a>
                    </li>
                </ol>
                <ol class="glass rounded-xl p-1">
                    <li>
                        <a href="../NewTask.html">
                            <img src="../../../assets/icons/Create.svg" alt="Adicionar tarefa">
                        </a>
                    </li>
                </ol>
            </nav>
        </footer>
    </div>
</body>
</html>
