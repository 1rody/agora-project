<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../../styles/Globals.css">
    <script type="module" src="../../../scripts/Session.js"></script>
    <script type="module" src="../../../scripts/Settings.js"></script>
    <title>Agora - Trocar senha</title>
</head>
<body class="google-sans" data-requires-session>
    <p class="p-2" data-startup-message role="status">
        <span>Se a página não carregar, abra o projeto pelo servidor HTTP local e acesse src/login.html.</span> <a class="text-primary" href="../../../login.html">Ir para o login</a>
    </p>
    <div data-startup-content hidden>
    <main class="flex flex-col w-full">
        <header class="flex w-full items-center justify-center gap-1 pt-5">
            <a class="glass rounded-xl p-1 text-xl text-primary" href="../Security.html#senha-recuperacao" aria-label="Voltar para segurança">←</a>
            <h1 class="text-xl text-center">TROCAR SENHA</h1>
        </header>
        <section class="p-2">
            <form id="change-password" class="glass rounded-md form-style" novalidate>
                <fieldset class="border-none flex flex-col">
                    <label class="text-primary text-sm" for="new-password">SENHA</label>
                    <input id="new-password" name="password" class="rounded-md text-primary" type="password" autocomplete="new-password" required>
                </fieldset>
                <fieldset class="border-none flex flex-col">
                    <label class="text-primary text-sm" for="repeat-password">REPITA A SENHA</label>
                    <input id="repeat-password" name="repeat" class="rounded-md text-primary" type="password" autocomplete="new-password" required>
                </fieldset>
                <div class="form-btns p-1"><button class="primary-btn w-fit" type="submit">TROCAR SENHA</button></div>
                <p class="text-sm" role="status"></p>
            </form>
        </section>
    </main>
    </div>
</body>
</html>
