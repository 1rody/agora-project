<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../styles/Globals.css">
    <link rel="stylesheet" href="../styles/History.css">
    <script type="module" src="../scripts/Session.js"></script>
    <script type="module">
        import { getSessionProfileId, showStartupContent } from "../scripts/Session.js";
        import { getHistoryByProfile, isTaskHistoryStatus } from "../data/HistoryMock.js";
        import { PRIORITY_LABELS, getTasksByProfile, subscribeToTasks } from "../data/MockTask.js";
        import { dateKey, formatTaskPeriod, parseTaskDate } from "../data/TaskDates.js";

        const labels = { adiada: "Adiada", cancelada: "Cancelada" };
        const list = document.querySelector("#history-list");
        const template = document.querySelector("#history-entry");
        const empty = document.querySelector("#history-empty");
        const order = document.querySelector("#history-order");
        const priority = document.querySelector("#history-priority");
        const date = document.querySelector("#history-date");
        const alphabetical = new Intl.Collator("pt-BR", { sensitivity: "base" });

        function renderHistory() {
            const entries = getHistoryByProfile(getSessionProfileId(), getTasksByProfile(getSessionProfileId()))
                .filter((entry) => isTaskHistoryStatus(entry.action))
                .filter((entry) => !priority.value || entry.priority === priority.value)
                .filter((entry) => !date.value || dateKey(entry.date) === date.value)
                .sort(order.value === "az"
                    ? (first, second) => alphabetical.compare(first.taskName, second.taskName)
                    : (first, second) => parseTaskDate(second.date) - parseTaskDate(first.date));

            const items = entries.map((entry) => {
                const item = template.content.cloneNode(true);
                item.querySelector('[data-field="taskName"]').textContent = entry.taskName;
                item.querySelector('[data-field="date"]').textContent = formatTaskPeriod(entry);
                item.querySelector('[data-field="priority"]').textContent = entry.priority ? "Prioridade " + (PRIORITY_LABELS[entry.priority] ?? "").toLowerCase() : "";
                item.querySelector('[data-field="priority"]').dataset.priority = entry.priority ?? "";
                item.querySelector('[data-field="action"]').textContent = entry.action === "concluída"
                    ? `Concluído em ${entry.tempoReal ?? 0} min` : labels[entry.action];
                return item;
            });

            list.replaceChildren(...items);
            empty.hidden = items.length > 0;
        }

        for (const filter of [order, priority, date]) filter.addEventListener("change", renderHistory);
        subscribeToTasks(renderHistory);
        window.addEventListener("pageshow", (event) => {
            if (event.persisted) renderHistory();
        });
        renderHistory();
        showStartupContent();
    </script>


    <title>Agora</title>
</head>
<body class="google-sans" data-requires-session>
    <p class="p-2" data-startup-message role="status">
        <span>Se a página não carregar, abra o projeto pelo servidor HTTP local e acesse src/login.html.</span> <a class="text-primary" href="../login.html">Ir para o login</a>
    </p>
    <div data-startup-content hidden>
    <main id="history" class="w-full flex flex-col">
        <header class="history-header"><a class="history-back glass" href="./Tarefas.html" aria-label="Voltar para tarefas">←</a><h1>HISTÓRICO</h1></header>
        <section class="history-filters" aria-label="Filtros do histórico">
            <label><span class="sr-only">Ordenar</span><select id="history-order" aria-label="Ordenar histórico"><option value="recent">MAIS RECENTES</option><option value="az">ORDENAR A-Z</option></select></label>
            <label><span class="sr-only">Prioridade</span><select id="history-priority" aria-label="Filtrar por prioridade"><option value="">PRIORIDADE: TODAS</option><option value="high">PRIORIDADE: ALTA</option><option value="medium">PRIORIDADE: MÉDIA</option><option value="low">PRIORIDADE: BAIXA</option></select></label>
            <label><span class="sr-only">Data</span><input id="history-date" type="date" aria-label="Filtrar por data do registro"></label>
        </section>
        <section class="history-results" aria-label="Tarefas no histórico"><div id="history-list" class="flex flex-col gap-1"></div><p id="history-empty" role="status" hidden>Nenhuma tarefa encontrada.</p></section>
        <template id="history-entry"><article class="history-card glass rounded-md"><div class="history-card-title"><h2 class="task-title" data-field="taskName"></h2><span class="priority text-xs" data-field="priority"></span></div><span class="task-time" data-field="action"></span><p class="text-xs" data-field="date"></p></article></template>
    </main>
    <footer class="fixed bottom-0 w-full items-center justify-center flex"><nav id="navigation" class="flex items-center w-full justify-between p-1" aria-label="Navegação principal"><ol class="flex items-center gap-1 glass rounded-xl p-1 justify-around"><li><a href="../app.html"><img src="../../assets/icons/Brand.svg" alt="Início"></a></li><li><a href="./Tarefas.html" aria-current="page"><img src="../../assets/icons/List.svg" alt="Tarefas"></a></li><li><a href="./settings/Settings.html"><img class="anim-rotating" src="../../assets/icons/Settings.svg" alt="Configurações"></a></li></ol><ol class="glass rounded-xl p-1"><li><a href="./NewTask.html"><img src="../../assets/icons/Create.svg" alt="Adicionar tarefa"></a></li></ol></nav></footer>
