<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../styles/Globals.css">
    <script type="module" src="../scripts/Auth.js"></script>
    <title>Agora - Recuperar conta</title>
</head>
<body class="google-sans">
    <p class="p-2" data-startup-message role="status">
        <span>Se a página não carregar, abra o projeto pelo servidor HTTP local e acesse src/login.html.</span>
    </p>
    <div data-startup-content hidden>
    <main id="recover-account" class="flex flex-col w-full gap-1">
        <header class="flex w-full items-center justify-center gap-1 pt-5">
            <a class="glass rounded-xl p-1 text-xl text-primary" href="../login.html" aria-label="Voltar ao login">←</a>
            <h1 class="text-xl text-center">Esqueceu a senha ou e-mail?</h1>
        </header>
        <section class="p-2">
            <form id="recovery-email-form" class="form-style" novalidate>
                <fieldset class="border-none flex flex-col">
                    <label class="text-primary text-sm" for="account-recovery-email">E-MAIL</label>
                    <input class="rounded-md text-primary" id="account-recovery-email" name="email" type="email" autocomplete="email" required>
                </fieldset>
                <div class="form-btns"><button type="submit">ENVIAR CÓDIGO</button></div>
            </form>
            <p id="recovery-sent" class="p-1" role="status" hidden>E-mail de recuperação enviado!</p>
            <form id="recovery-code-form" class="form-style" novalidate hidden>
                <fieldset class="border-none flex flex-col">
                    <label class="text-primary text-sm" for="account-recovery-code">Código de verificação</label>
                    <input class="rounded-md text-primary" id="account-recovery-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" required>
                </fieldset>
                <div class="form-btns"><button type="submit">ENVIAR CÓDIGO</button></div>
            </form>
            <p class="text-sm p-1" data-field="message" role="status"></p>
            <a id="recovery-login" class="text-primary p-1" href="../login.html" hidden>Voltar ao login</a>
        </section>
    </main>
    </div>
</body>
</html>
