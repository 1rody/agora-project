<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./styles/Globals.css">
    <script type="module">
        import { addAccount, getProfileByEmail, setSession } from "./data/AccountMock.js";
        const form = document.querySelector("#register-form");
        const message = form.querySelector('[data-field="message"]');

        //ao enviar cria a conta no array e mostra a mensagem
        form.addEventListener("submit", (event) => {
            event.preventDefault();

            const name = form.elements.name.value.trim();
            const email = form.elements.email.value.trim();
            const password = form.elements.password.value;

            if (password !== form.elements.confirm.value) {
                message.textContent = "As senhas nao conferem";
                return;
            }

            if (getProfileByEmail(email)) {
                message.textContent = "Email ja cadastrado";
                return;
            }

            const profile = addAccount(name, email, password);
            setSession(profile.id);
            location.href = "./app.html";
        });
    </script>


    <title>Agora</title>
</head>
<body class="google-sans">
    <main id="register" class="w-full gap-1 overflow-hidden flex flex-col h-screen">
        <form  id="register-form" class="p-1 form-style  flex text-primary flex-col items-center h-screen justify-center">
            <div class="flex w-full items-center inversion-colors justify-center">
                <img src="../assets//icons/logo.png" alt="Agora logo">
            </div>
            <div id="other-login" class="inversion-colors">
              <button type="button">G</button>
              <button type="button">G</button>
              <button type="button">G</button>
            </div>
            <fieldset class="border-none flex flex-col w-full">
                <label for="name" class="text-primary text-sm">NOME</label>
                <input class="p-1 rounded-md text-primary bg-background" placeholder="Jhon" type="text" name="name" id="name" required>
            </fieldset>
            <fieldset class="border-none flex flex-col w-full">
                <label for="email" class="text-primary text-sm">EMAIL</label>
                <input class="p-1 rounded-md text-primary bg-background" placeholder="jhon@mail.com" type="email" name="email" id="email" required>
            </fieldset>
            <fieldset class="border-none flex flex-col w-full">
                <label for="password" class="text-primary text-sm">SENHA</label>
                <input class="p-1 rounded-md text-primary bg-background" placeholder="123#4$*Aa1213" type="password" name="password" id="password" required>
            </fieldset>
            <fieldset class="border-none flex flex-col w-full">
                <label for="confirm" class="text-primary text-sm">REPITA A SENHA</label>
                <input class="p-1 rounded-md text-primary bg-background" placeholder="123#4$*Aa1213" type="password" name="confirm" id="confirm" required>
            </fieldset>
            <p class="text-sm pt-5" data-field="message"></p>
            <div class="form-btns flex items-center justify-center">
                <button class="primary-btn" type="submit">Registrar-se</button>
                <p>ou</p>
                <a class="text-sm text-primary" href="./login.html">login</a>
            </div>

        </form>
    </main>
</body>

</html>
