<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./styles/Globals.css">
        <link rel="stylesheet" href="./styles/Auth.css">
        <script type="module" src="./scripts/Auth.js"></script>
        <title>Agora - Login</title>
    </head>
    <body class="google-sans">
        <p class="p-2" data-startup-message role="status">
            <span>Se a página não carregar, abra o projeto pelo servidor HTTP local e acesse src/login.html.</span>
        </p>
        <div data-startup-content hidden>
            <main class="auth-page">
                <form id="login-form" class="form-style auth-form" novalidate>
                    <img class="auth-logo inversion-colors" src="../assets/icons/logo.png" alt="Agora">
                    <div id="other-login">
                        <button type="button" data-social-login aria-label="Entrar com Google">
                            <img src="../assets/icons/Google.svg" alt="">
                        </button>
                        <button type="button" data-social-login aria-label="Entrar com nuvem">
                            <img src="../assets/icons/Cloud.svg" alt="">
                        </button>
                        <button type="button" data-social-login aria-label="Entrar com Windows">
                            <img src="../assets/icons/Windows.svg" alt="">
                        </button>
                    </div>
                    <fieldset class="border-none">
                        <label for="login-mail" class="text-sm">E-MAIL</label>
                        <input id="login-mail" name="email" type="email" autocomplete="username" placeholder=" " required>
                    </fieldset>
                    <fieldset class="border-none">
                        <label for="login-password" class="text-sm">SENHA</label>
                        <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder=" " required>
                    </fieldset>
                    <p class="form-error" role="status" data-field="message"></p>
                    <div class="form-btns">
                        <button type="submit">ENTRAR</button>
                        <span>OU</span>
                        <a href="./Register.html">REGISTRE-SE</a>
                    </div>
                    <a class="auth-help" href="./pages/RecoverAccount.html">Esqueceu sua senha?</a>
                </form>
            </main>
        </div>
    </body>
</html>
